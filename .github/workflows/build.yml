# Compile la solution (app MAUI Windows comprise) et lance les tests a chaque push et pull request.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Workload MAUI
        run: dotnet workload install maui-windows

      - name: Build
        run: dotnet build src/SqlToolManagerMaui.slnx -c Release

      - name: Tests
        run: dotnet test src/SqlToolManagerMaui.Tests/SqlToolManagerMaui.Tests.csproj -c Release --no-build
