# Tests rapides (sans workload MAUI) a chaque push/PR.
# Build complet de l'app MAUI Windows uniquement sur PR et sur master.
name: Build

on:
  push:
    branches: [master]
    paths: ['src/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', '.github/workflows/build.yml']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: dotnet test src/SqlToolManagerMaui.Tests/SqlToolManagerMaui.Tests.csproj -c Release

  build-maui:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Workload MAUI
        run: dotnet workload restore src/SqlToolManagerMaui.slnx --skip-manifest-update

      - name: Build
        run: dotnet build src/SqlToolManagerMaui.slnx -c Release