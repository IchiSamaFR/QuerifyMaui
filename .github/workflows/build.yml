# Tests sur le runner auto-heberge Linux (VPS), sans workload MAUI.
# Le build de l'app MAUI Windows se lance a la demande sur un runner Windows heberge par GitHub.
name: Build

on:
  push:
    branches: [master]
    paths: ['src/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', '.github/workflows/build.yml']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: dotnet test src/Querify.Tests/Querify.Tests.csproj -c Release

  build-maui:
    # Uniquement a la demande (Actions > Build > Run workflow), pour limiter les couts.
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # SDK et workload MAUI de l'image (installes par Visual Studio) : un setup-dotnet changerait
      # de feature band et forcerait la mise a jour de tous les workloads (~5 min).
      - name: SDK
        run: |
          dotnet --version
          dotnet workload list

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props', 'src/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build src/Querify.slnx -c Release