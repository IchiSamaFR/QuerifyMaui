# Compile la solution (app MAUI Windows comprise) et lance les tests.
# Execute sur un runner auto-heberge Windows (SDK .NET 10 + workload maui-windows preinstalles).
name: Build

on:
  push:
    branches: [master]
    paths: ['src/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', '.github/workflows/build.yml']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore src/SqlToolManagerMaui.slnx

      - name: Build
        run: dotnet build src/SqlToolManagerMaui.slnx -c Release --no-restore

      - name: Tests
        run: dotnet test src/SqlToolManagerMaui.Tests/SqlToolManagerMaui.Tests.csproj -c Release --no-build