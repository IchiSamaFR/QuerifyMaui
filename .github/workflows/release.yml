# Publication d'une version : pousser un tag vX.Y.Z (ex. git tag v0.1.0 && git push origin v0.1.0).
# Build self-contained (runtimes .NET et Windows App SDK embarques) zippe et joint a une release GitHub.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tests:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: dotnet test src/Querify.Tests/Querify.Tests.csproj -c Release

  publish:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # SDK et workload MAUI de l'image (installes par Visual Studio) : un setup-dotnet changerait
      # de feature band et forcerait la mise a jour de tous les workloads (~5 min).
      - name: SDK
        run: |
          dotnet --version
          dotnet workload list

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props', 'src/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Version
        id: version
        shell: pwsh
        run: |
          $full = '${{ github.ref_name }}'.TrimStart('v')
          # ApplicationDisplayVersion n'accepte que des chiffres : le suffixe (-beta...) reste dans Version.
          $numeric = $full.Split('-')[0]
          "full=$full" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
          "prerelease=$($full.Contains('-'))" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish src/Querify/Querify.csproj -c Release
          -f net10.0-windows10.0.19041.0 -r win-x64
          -p:Version=${{ steps.version.outputs.full }}
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.numeric }}
          -p:QuerifySelfContained=true
          -p:RunAnalyzers=false
          -p:EnforceCodeStyleInBuild=false
          -p:PublishReadyToRun=false
          -o publish

      - name: Archive
        shell: pwsh
        # 7-Zip (preinstalle) : Compress-Archive est tres lent sur un publish self-contained.
        run: 7z a -tzip -mx=5 "Querify-${{ steps.version.outputs.full }}-win-x64.zip" .\publish\*

      - name: Release GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--generate-notes', '--title', 'Querify ${{ steps.version.outputs.full }}')
          if ('${{ steps.version.outputs.prerelease }}' -eq 'True') { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' "Querify-${{ steps.version.outputs.full }}-win-x64.zip" @flags
